<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Nimbalkar Traders – निंबाळकर ट्रेडर्स</title>
<desc id="desc">A traditional Indian spice brand emblem with a cream ornamental plaque, deep maroon lettering, golden borders and a red chilli with green leaves.</desc>
